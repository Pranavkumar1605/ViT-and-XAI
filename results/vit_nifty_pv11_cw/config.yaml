run_id: vit_nifty_pv11_cw
seed: 0
model_config: model_vit.yaml
train_config: train.yaml
xai_config: xai.yaml
indicators_config: indicators.yaml
paths:
  data_dir: data
  results_dir: results
data:
  start: '2008-01-01'
  end: '2025-12-31'
  index_ticker: ^NSEI
  history_tolerance_days: 30
  calendar_min_share: 0.5
  max_tickers: null
  tickers:
  - ADANIENT
  - ADANIPORTS
  - APOLLOHOSP
  - ASIANPAINT
  - AXISBANK
  - BAJAJ-AUTO
  - BAJFINANCE
  - BAJAJFINSV
  - BEL
  - BHARTIARTL
  - CIPLA
  - COALINDIA
  - DRREDDY
  - EICHERMOT
  - ETERNAL
  - GRASIM
  - HCLTECH
  - HDFCBANK
  - HDFCLIFE
  - HINDALCO
  - HINDUNILVR
  - ICICIBANK
  - INDIGO
  - INFY
  - ITC
  - JIOFIN
  - JSWSTEEL
  - KOTAKBANK
  - LT
  - M&M
  - MARUTI
  - MAXHEALTH
  - NESTLEIND
  - NTPC
  - ONGC
  - POWERGRID
  - RELIANCE
  - SBILIFE
  - SBIN
  - SHRIRAMFIN
  - SUNPHARMA
  - TATACONSUM
  - TMPV
  - TATASTEEL
  - TCS
  - TECHM
  - TITAN
  - TRENT
  - ULTRACEMCO
  - WIPRO
labels:
  method: peak_valley
  window: 11
  theta: 0.01
  names:
  - Hold
  - Buy
  - Sell
  file: labels_pv11.parquet
folds:
  train_years: 5
  val_months: 6
  first_test_year: 2013
  last_test_year: 2025
image:
  window: 65
  clip: 5.0
train:
  seeds:
  - 0
  batch_size: 256
  max_epochs: 50
  patience: 6
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 2
  class_weights: true
  amp: true
  num_workers: 2
model:
  name: vit
  img_size:
  - 90
  - 65
  patch_size:
  - 10
  - 13
  in_chans: 1
  num_classes: 3
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.1
  attn_drop_rate: 0.0
xai:
  methods:
  - integrated_gradients
  - row_occlusion
  - chefer
  samples_per_class: 200
  target: predicted
  batch_size: 32
  integrated_gradients:
    n_steps: 50
    internal_batch_size: 64
  row_occlusion:
    fill_value: 0.0
  chefer:
    start_layer: 0
  top_k_plot: 20
indicators:
