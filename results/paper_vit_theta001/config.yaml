run_id: paper_vit_theta001
seed: 0
model_config: model_vit.yaml
train_config: ../train.yaml
xai_config: ../xai.yaml
indicators_config: indicators.yaml
paths:
  data_dir: data_paper_etf
  results_dir: results
data:
  start: '2002-01-01'
  end: '2021-12-31'
  index_ticker: ^GSPC
  yahoo_suffix: ''
  history_tolerance_days: 30
  calendar_min_share: 0.5
  max_tickers: null
  tickers:
  - XLF
  - XLU
  - QQQ
  - SPY
  - XLP
  - EWZ
  - EWH
  - XLY
  - XLE
labels:
  method: threshold
  window: 11
  theta: 0.01
  file: labels_theta001.parquet
  names:
  - Hold
  - Buy
  - Sell
folds:
  train_years: 5
  val_months: 6
  first_test_year: 2007
  last_test_year: 2021
image:
  window: 65
  clip: 5.0
backtest:
  start_money: 10000.0
  commission: 1.0
  risk_free_annual: 0.0
train:
  seeds:
  - 0
  batch_size: 256
  max_epochs: 50
  patience: 6
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 2
  class_weights: false
  amp: true
  num_workers: 2
model:
  name: vit
  img_size:
  - 65
  - 65
  patch_size:
  - 13
  - 13
  in_chans: 1
  num_classes: 3
  embed_dim: 192
  depth: 6
  num_heads: 6
  mlp_ratio: 4.0
  qkv_bias: true
  drop_rate: 0.1
  attn_drop_rate: 0.0
xai:
  methods:
  - integrated_gradients
  - row_occlusion
  - chefer
  samples_per_class: 200
  target: predicted
  batch_size: 32
  integrated_gradients:
    n_steps: 50
    internal_batch_size: 64
  row_occlusion:
    fill_value: 0.0
  chefer:
    start_layer: 0
  top_k_plot: 20
indicators:
  active_subset: null
  subsets: {}
  indicators:
  - name: BETA
    func: BETA
    inputs:
    - index_close
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: none
  - name: CORREL
    func: CORREL
    inputs:
    - close
    - index_close
    params:
      timeperiod: 14
    category: statistics
    transform: none
  - name: LINEARREG
    func: LINEARREG
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: rel_close
  - name: LINEARREG_ANGLE
    func: LINEARREG_ANGLE
    inputs:
    - logclose100
    params:
      timeperiod: 14
    category: statistics
    transform: none
  - name: LINEARREG_INTERCEPT
    func: LINEARREG_INTERCEPT
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: rel_close
  - name: LINEARREG_SLOPE
    func: LINEARREG_SLOPE
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: div_close
  - name: STDDEV
    func: STDDEV
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: div_close
  - name: TSF
    func: TSF
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: rel_close
  - name: VAR
    func: VAR
    inputs:
    - close
    params:
      timeperiod: 14
    category: statistics
    transform: div_close_sq
  - name: AVGPRICE
    func: AVGPRICE
    inputs:
    - open
    - high
    - low
    - close
    params: {}
