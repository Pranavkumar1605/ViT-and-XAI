[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vitxai"
version = "0.1.0"
description = "ViT + XAI on 90 x 65 technical-indicator images (NIFTY 50 Buy/Hold/Sell)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
